query {
  repository(owner: "lamuniercosta", name: "dotnet-agent-harness") {
    pullRequest(number: 166) {
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          comments(first: 100) {
            nodes {
              id
              body
              author { login }
            }
          }
        }
      }
    }
  }
}
