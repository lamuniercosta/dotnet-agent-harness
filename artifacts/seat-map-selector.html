<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="seat-map-token" content="__SEAT_MAP_TOKEN__">
  <title>Maestri Seat Map</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131d2e;
      --border: #1e2e4a;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 1.25rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem;
    }
    .stat .label, .muted { color: var(--muted); font-size: 0.75rem; }
    .stat .n { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.9rem; }
    .codename { font-weight: 700; }
    .rung {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      margin-top: 0.4rem;
      cursor: pointer;
      background: #0b1220;
    }
    .rung.active { border-color: var(--accent); background: #0f2744; }
    .rung code { font-size: 0.7rem; color: var(--muted); display: block; margin-top: 0.2rem; word-break: break-all; }
    .badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.1rem 0.4rem; border: 1px solid var(--border); border-radius: 999px; }
    #toast { min-height: 1.2rem; font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0 1rem; }
    .cmd { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .cmd input {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      color: var(--fg);
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }
    .cmd button {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #apply { display: none; margin-bottom: 1rem; }
    #apply.show { display: block; }
  </style>
</head>
<body>
  <h1>Maestri Seat Map</h1>
  <p class="sub">Ordered rungs per seat (head first, floor last). Selecting a rung POSTs <code>activeRung</code> with the session token.</p>
  <div class="stats">
    <div class="stat"><div class="label">CURSOR heads</div><div class="n" id="cCursor">–</div><div id="bCursor" class="muted"></div></div>
    <div class="stat"><div class="label">AGY-G heads</div><div class="n" id="cAgy">–</div><div id="bAgy" class="muted"></div></div>
    <div class="stat"><div class="label">GEMINI heads</div><div class="n" id="cGem">–</div><div id="bGem" class="muted"></div></div>
    <div class="stat"><div class="label">ZEN floors</div><div class="n" id="cZen">–</div><div id="bZen" class="muted"></div></div>
  </div>
  <div id="toast"></div>
  <section id="apply" class="card">
    <div class="muted" id="applyNote"></div>
    <div class="cmd">
      <input id="applyCmd" type="text" readonly spellcheck="false">
      <button type="button" id="applyCopy">Copy</button>
    </div>
  </section>
  <main id="grid" class="grid"></main>
  <script>
    const token = document.querySelector('meta[name="seat-map-token"]').getAttribute('content');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function seatRungs(seat) {
      return Array.isArray(seat && seat.rungs) ? seat.rungs : [];
    }

    function rungByName(seat, name) {
      return seatRungs(seat).find(r => r && r.name === name) || {};
    }

    function rungByRole(seat, role) {
      return seatRungs(seat).find(r => r && r.role === role) || null;
    }

    function toast(msg, cls) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = cls || '';
    }

    function quotePsArg(value) {
      return "'" + String(value ?? '').replace(/'/g, "''") + "'";
    }

    function recruitCommand(seat, rung) {
      const cell = rungByName(seat, rung);
      const code = quotePsArg(seat.codename);
      const preset = quotePsArg(seat.preset || '');
      const launch = quotePsArg(cell.launch || '');
      return 'maestri recruit ' + code + ' --preset ' + preset + ' --command ' + launch + ' --replace ' + code;
    }

    async function copyText(text, input) {
      try {
        await navigator.clipboard.writeText(text);
        toast('Copied. Paste it in the Maestro terminal.', 'ok');
      } catch (_) {
        if (input) { input.focus(); input.select(); }
        toast('Clipboard blocked; the command is selected, press Ctrl+C.', 'bad');
      }
    }

    function showApply(cmd, note) {
      const panel = document.getElementById('apply');
      document.getElementById('applyCmd').value = cmd;
      document.getElementById('applyNote').textContent = note;
      panel.classList.add('show');
    }

    function poolOfRole(seat, role) {
      const cell = rungByRole(seat, role);
      return cell && cell.pool ? cell.pool : '';
    }

    function updateStats(seats, limits) {
      const maxCursor = limits.maxCursorHeads ?? 3;
      const maxAgy = limits.maxAgyGHeads ?? 3;
      const minGem = limits.minGeminiHeads ?? 1;
      const inv = { cursor: 0, agy: 0, gem: 0, zen: 0 };
      seats.forEach(s => {
        if (poolOfRole(s, 'head') === 'CURSOR') inv.cursor++;
        if (poolOfRole(s, 'head') === 'AGY-G') inv.agy++;
        if (poolOfRole(s, 'head') === 'GEMINI') inv.gem++;
        if (poolOfRole(s, 'floor') === 'ZEN') inv.zen++;
      });
      document.getElementById('cCursor').textContent = inv.cursor;
      document.getElementById('cAgy').textContent = inv.agy;
      document.getElementById('cGem').textContent = inv.gem;
      document.getElementById('cZen').textContent = inv.zen;
      const set = (id, ok, okText, badText) => {
        const el = document.getElementById(id);
        el.textContent = ok ? okText : badText;
        el.className = ok ? 'ok' : 'bad';
      };
      set('bCursor', inv.cursor <= maxCursor, `≤${maxCursor} OK`, `over ${maxCursor}`);
      set('bAgy', inv.agy <= maxAgy, `≤${maxAgy} OK`, `over ${maxAgy}`);
      set('bGem', inv.gem >= minGem, `≥${minGem} OK`, `need ≥${minGem}`);
      set('bZen', inv.zen <= 1, 'Quill excepted', 'too many ZEN floors');
    }

    function render(map) {
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      (map.seats || []).forEach(seat => {
        const active = seat.activeRung || (rungByRole(seat, 'head') || {}).name || '';
        const card = document.createElement('article');
        card.className = 'card';

        const title = document.createElement('div');
        const codeName = document.createElement('span');
        codeName.className = 'codename';
        codeName.textContent = seat.codename || '';
        const seatName = document.createElement('span');
        seatName.className = 'muted';
        seatName.textContent = ' · ' + (seat.name || '');
        title.append(codeName, seatName);
        card.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'muted';
        meta.textContent = `${seat.preset || ''} · activeRung=${active}`;
        card.appendChild(meta);

        seatRungs(seat).forEach(cell => {
          const name = cell && cell.name ? String(cell.name) : '';
          const el = document.createElement('div');
          el.className = 'rung' + (name === active ? ' active' : '');
          el.dataset.seat = seat.id || '';
          el.dataset.rung = name;
          const left = document.createElement('div');
          const strong = document.createElement('strong');
          strong.textContent = name;
          left.appendChild(strong);
          if (cell && cell.role === 'floor') {
            left.appendChild(document.createTextNode(' '));
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = 'FLOOR';
            left.appendChild(badge);
          }
          const code = document.createElement('code');
          code.textContent = (cell && cell.launch) || '';
          left.appendChild(code);
          const right = document.createElement('span');
          right.className = 'badge';
          right.textContent = `${(cell && cell.pool) || ''} · t${(cell && cell.tier) || '?'}`;
          el.append(left, right);
          card.appendChild(el);
        });

        const cmd = document.createElement('div');
        cmd.className = 'cmd';
        const input = document.createElement('input');
        input.type = 'text';
        input.readOnly = true;
        input.spellcheck = false;
        input.value = recruitCommand(seat, active);
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.copy = seat.id || '';
        button.textContent = 'Copy';
        button.addEventListener('click', ev => {
          const field = ev.currentTarget.parentElement.querySelector('input');
          copyText(field.value, field);
        });
        cmd.append(input, button);
        card.appendChild(cmd);
        grid.appendChild(card);
      });
      updateStats(map.seats || [], map.invariants || {});
      grid.querySelectorAll('.rung').forEach(el => {
        el.addEventListener('click', () => selectRung(el.dataset.seat, el.dataset.rung));
      });
    }

    async function load() {
      const res = await fetch('/api/seats');
      if (!res.ok) throw new Error('GET /api/seats failed');
      render(await res.json());
    }

    async function selectRung(seatId, rung) {
      toast(`Setting ${seatId} activeRung=${rung}…`);
      const res = await fetch('/api/seats/set', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Seat-Map-Token': token
        },
        body: JSON.stringify({ seatId, rung, activeRung: rung })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        toast(data.error || 'swap failed', 'bad');
        return;
      }
      toast(`activeRung ${data.seat} → ${data.activeRung}`, 'ok');
      const note = data.liveSwapped
        ? `${data.seat}: recruit --replace ran from this terminal. Command kept here in case you need to rerun it.`
        : `${data.seat}: map, roles and notes updated. The terminal was not replaced; paste this in the Maestro terminal.`;
      showApply(data.recruitCommand || recruitCommand({ codename: data.seat, preset: '', rungs: [{ name: data.activeRung, launch: data.launch }] }, data.activeRung), note);
      await load();
    }

    document.getElementById('applyCopy').addEventListener('click', () => {
      const input = document.getElementById('applyCmd');
      copyText(input.value, input);
    });

    load().catch(err => toast(String(err), 'bad'));
  </script>
</body>
</html>
