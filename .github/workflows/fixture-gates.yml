name: Fixture gates

# The proof that this harness enforces anything.
#
# Installs the harness into fixtures/BadCode and asserts every gate exits
# NON-ZERO on the deliberately broken code, then applies the fix and asserts
# every gate exits ZERO.
#
# Both directions matter. Asserting only red would let a gate that always fails
# pass CI; asserting only green would let a gate that never fires pass. A gate
# must catch bad code AND stay quiet on good code - one that cries wolf gets
# switched off, which is a slower way of not having it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates catch, then clear
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the harness into the fixture
        shell: pwsh
        run: ./install.ps1 ./fixtures/BadCode -Platform both

      - name: Restore tools (jb, stryker)
        working-directory: fixtures/BadCode
        run: dotnet tool restore

      # Written explicitly rather than trusting the checked-out state, so the
      # job is deterministic even if someone commits the fixture mid-fix.
      - name: Put the fixture in its broken state
        shell: pwsh
        working-directory: fixtures/BadCode
        run: ./scripts/restore-broken.ps1

      - name: Build the broken fixture
        working-directory: fixtures/BadCode
        # continue-on-error: the fixture is MEANT to produce findings, and
        # RS0030 (DateTime.Now) is configured as an error, so a clean build is
        # not expected here. The gates are the assertion, not the build.
        continue-on-error: true
        run: dotnet build --verbosity quiet

      # ---- RED ----------------------------------------------------------
      - name: Gates must FAIL on the broken fixture
        shell: pwsh
        working-directory: fixtures/BadCode
        run: ./scripts/Assert-Gates.ps1 -Expect Fail


      # ---- GREEN --------------------------------------------------------
      - name: Apply the fix
        shell: pwsh
        working-directory: fixtures/BadCode
        run: ./scripts/apply-fix.ps1

      - name: Rebuild after the fix
        working-directory: fixtures/BadCode
        run: dotnet build --verbosity quiet

      - name: Gates must PASS on the fixed fixture
        shell: pwsh
        working-directory: fixtures/BadCode
        run: ./scripts/Assert-Gates.ps1 -Expect Pass

      - name: Tests must pass after the fix
        working-directory: fixtures/BadCode
        run: dotnet test --no-build --verbosity quiet

      # Mutation is scoped to the two files the fixture actually tests. The
      # other classes exist to trip ANALYZER gates and deliberately have no
      # tests, so an unscoped run scores ~8% on 54 uncovered mutants - a real
      # number, but one that measures the fixture's design rather than whether
      # the mutation gate works.
      #
      # A survivor here would mean the boundary assertion apply-fix added does
      # not actually kill the mutant: the difference between a test that looks
      # right and one that works.
      - name: Mutation must PASS on the fixed fixture
        working-directory: fixtures/BadCode
        run: dotnet stryker --mutate "**/Discount.cs" --mutate "**/Percentage.cs" --reporter progress --reporter json

      # Proven from the FIXED state by weakening only the test, because the
      # broken fixture does not compile (RS0030 on DateTime.Now is an error) and
      # Stryker cannot mutate a project that will not build. Running it there
      # would fail for the wrong reason and prove nothing.
      #
      # Without this step only the green half runs, and a mutation gate that
      # never caught anything would look healthy.
      - name: Mutation must FAIL when the test is inadequate
        shell: pwsh
        working-directory: fixtures/BadCode
        run: |
          $test = 'Bad.Tests/DiscountTests.cs'
          $original = Get-Content -LiteralPath $test -Raw

          # Drop the boundary assertion; keep the two far-from-threshold cases.
          # Line coverage stays 100%, so only mutation can see the difference.
          @'
          using Xunit;

          namespace Bad.Tests;

          public class DiscountTests
          {
              [Fact]
              public void Apply_WellAboveThreshold_Discounts()
              {
                  Assert.Equal(180m, Discount.Apply(200m));
              }

              [Fact]
              public void Apply_WellBelowThreshold_DoesNotDiscount()
              {
                  Assert.Equal(50m, Discount.Apply(50m));
              }
          }
          '@ -replace '(?m)^          ', '' | Set-Content -LiteralPath $test -Encoding UTF8

          try {
            dotnet build --verbosity quiet
            dotnet stryker --mutate "**/Discount.cs" --reporter progress
            if ($LASTEXITCODE -eq 0) {
              Write-Host '::error::Mutation passed with the boundary unasserted - the gate did not catch a surviving mutant.'
              exit 1
            }
            Write-Host "Mutation correctly failed (exit $LASTEXITCODE): the unasserted boundary let the mutant survive."
          }
          finally {
            Set-Content -LiteralPath $test -Value $original -NoNewline -Encoding UTF8
          }
