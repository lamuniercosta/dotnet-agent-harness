# gitleaks configuration for dotnet-agent-harness.
#
# A single [allowlist] map, not repeated [[allowlist]] tables - gitleaks 8.x
# rejects the array form with "'Allowlist' expected a map, got 'slice'".
#
# Three paths contain credential-SHAPED strings on purpose:
#
#   hooks/Test-SecretScan.ps1  the secret scanner's own test suite. It must
#                              contain realistic shapes or it asserts nothing.
#                              Every value is assembled at runtime from string
#                              fragments, so no credential-shaped literal
#                              exists in the file - GitHub push protection
#                              rejected the first version, correctly, and that
#                              is why.
#
#   hooks/secret-scan.ps1      the detection patterns themselves.
#
#   fixtures/BadCode/          the gate fixture: deliberate code violations,
#                              no credentials. Allowlisted so a future fixture
#                              addition cannot fail this job over a planted,
#                              non-secret string.
#
# Allowlisting the scanner's own tests is not a loophole. An exception that
# lets the test suite keep proving the scanner works is worth more than a green
# job with no scanner behind it.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and detection patterns - shapes by design, not secrets"
paths = [
    '''hooks/Test-SecretScan\.ps1''',
    '''hooks/secret-scan\.ps1''',
    '''fixtures/BadCode/.*''',
]
